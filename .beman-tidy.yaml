# This is the config file for beman-tidy, which checks compliance with the Beman Standard (https://github.com/bemanproject/beman/blob/main/docs/beman_standard.md)
# Check documentation for beman-tidy here:
# https://github.com/bemanproject/beman-tidy/blob/main/README.md

disabled_rules:
  # TODO: Enable once README.md documents which WG21 papers this library implements (see readme.implements).
  - readme.implements
  # TODO: Enable once a trunk version is deployed on Compiler Explorer with nightyclone mode (see release.godbolt_trunk_version).
  - release.godbolt_trunk_version
  # TODO: Enable once the main library target is built unconditionally by default. The modules toggle currently chooses STATIC vs INTERFACE via conditional add_library.
  - cmake.default
  # TODO: Enable once module builds no longer rely on target_compile_features PUBLIC (needs separate design; removing it today breaks module support).
  - cmake.passive_targets
  # This repository holds three libraries (beman.transpose,
  # beman.tree_algorithms, beman.fingertree) rather than one named after the
  # repository, and colocates each library's headers and tests under
  # src/beman/<lib>/ rather than splitting include/ and tests/. These rules
  # assume a single beman.typeclass library in the split layout; see README.md.
  - cmake.library_name
  - cmake.library_alias
  - directory.sources
  - directory.tests
  - file.names
ignored_paths:
  - infra/
  # Vendored MPark.WG21, maintained upstream.
  - papers/wg21/
  # The coherence skill is agent configuration, not documentation.
  - .claude/
  # Local build and environment state; absent in CI.
  - .build/
  - .venv/
